<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 224" width="1000" height="224" role="img" aria-label="Alertness Detection System: Real-time fatigue detection built on interpretable computer-vision logic"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EC8F8"/><stop offset="1" stop-color="#A9DDFB"/></linearGradient><clipPath id="p"><rect width="1000" height="224" rx="22"/></clipPath></defs><rect width="1000" height="224" rx="22" fill="url(#sk)"/><g clip-path="url(#p)"><circle cx="500" cy="20" r="70" fill="#fff" opacity=".3"><animateTransform attributeName="transform" type="translate" values="0 0;0 16;0 0" dur="7s" repeatCount="indefinite"/></circle><circle cx="980" cy="200" r="60" fill="#fff" opacity=".3"><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6s" repeatCount="indefinite"/></circle><circle cx="40" cy="210" r="50" fill="#fff" opacity=".3"><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="8s" repeatCount="indefinite"/></circle></g><text x="36" y="58" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#123C9C">Computer vision  |  Python, OpenCV, Flask, MediaPipe</text><text x="36" y="108" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#0B1F4B">Alertness Detection System</text><text x="36" y="146" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#0B1F4B">Real-time fatigue detection built on</text><text x="36" y="170" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#0B1F4B">interpretable computer-vision logic</text><rect x="36" y="188" width="90" height="5" rx="3" fill="#0B1F4B"><animate attributeName="width" values="40;240;40" dur="4s" repeatCount="indefinite"/></rect><g><rect x="560" y="60" width="128" height="104" rx="16" fill="#0B1F4B"/><rect x="560" y="60" width="128" height="104" rx="16" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="opacity" values=".1;.9;.1" dur="3s" begin="0.0s" repeatCount="indefinite"/></rect><text x="624" y="108" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#fff">EAR + MAR</text><text x="624" y="136" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#7EC8F8">face geometry</text></g><g><rect x="700" y="60" width="128" height="104" rx="16" fill="#0B1F4B"/><rect x="700" y="60" width="128" height="104" rx="16" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="opacity" values=".1;.9;.1" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect><text x="764" y="108" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#fff">0 to 100</text><text x="764" y="136" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#7EC8F8">focus score</text></g><g><rect x="840" y="60" width="128" height="104" rx="16" fill="#0B1F4B"/><rect x="840" y="60" width="128" height="104" rx="16" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="opacity" values=".1;.9;.1" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect><text x="904" y="108" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#fff">CPU only</text><text x="904" y="136" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#7EC8F8">no training</text></g></svg>